spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shop_v2_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: shop_user
    password: "123456"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # Giữ dòng này nếu shop_db đã có sẵn dữ liệu trước đó
    baseline-version: 1